[package]
name = "botsay"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Like cowsay, but with cute little block-character robots"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/maebert/botsay"
keywords = ["cowsay", "robot", "ascii-art", "terminal", "fun"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/design"]

[dependencies]
lexopt = "0.3.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
