name: Release

# Push a tag like `v0.3.0` (matching the version in Cargo.toml) to test and
# build botsay, publish a GitHub Release, and update the Homebrew formula in
# maebert/homebrew-tap.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}
  TARGETS: aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Create draft release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: Create draft release with notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '/^## \[/ { p = index($0, "[" v "]") > 0; next } /^\[.*\]: / { next } p' CHANGELOG.md > notes.md
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and upload
        run: |
          name="botsay-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/botsay README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256"

  publish:
    name: Publish release and update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish release
        run: gh release edit "$TAG" --draft=false
      - name: Write formula
        run: |
          gh release download "$TAG" -p '*.sha256'
          args=(-e "s|@REPOSITORY@|$GITHUB_REPOSITORY|g"
                -e "s|@URL@|https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/botsay-$TAG|g")
          for target in $TARGETS; do
            args+=(-e "s|@SHA256_$target@|$(cut -d ' ' -f 1 "botsay-$TAG-$target.tar.gz.sha256")|")
          done
          sed "${args[@]}" .github/formula.rb.in > botsay.rb
          if grep -n '@[A-Za-z0-9_-]*@' botsay.rb; then
            echo "::error::Unfilled placeholders in the formula"
            exit 1
          fi
          cat botsay.rb
      - name: Push formula to maebert/homebrew-tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:maebert/homebrew-tap.git tap
          cp botsay.rb tap/Formula/botsay.rb
          cd tap
          git add Formula/botsay.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "botsay ${TAG#v}"
          git push

  cleanup:
    name: Delete the draft release
    needs: [release, build, publish]
    if: failure() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = true ]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi

  verify:
    name: Verify Homebrew install
    needs: publish
    uses: ./.github/workflows/homebrew.yml
